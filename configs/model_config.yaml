# Model versions and generation parameters used in the study.
# Scripts in scripts/ read their defaults from `stages`; command-line flags override them.
# Each benchmark case was run for 3 rounds. No random seed was set.
# max_tokens: null means no limit was passed to the API.

api:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY

# OpenRouter model IDs do not pin a dated snapshot, so the access period is given instead.
models:
  google/gemini-3-pro-preview: 2026-01-18 to 2026-03-25
  openai/gpt-4o: 2026-02-06 to 2026-02-18
  openai/gpt-5.2: 2026-02-06
  qwen/qwen3-vl-235b-a22b-thinking: 2026-03-06 to 2026-03-25

stages:
  forward_translation:
    model: google/gemini-3-pro-preview
    temperature: 0.2
    max_tokens: 10000

  back_translation:
    model: google/gemini-3-pro-preview
    temperature: 0.2
    max_tokens: 10000  # MIMIC-III: 1000

  healthbench_answer:
    model: openai/gpt-5.2
    temperature: 0.2
    max_tokens: null
    rounds: 3
    also_run_with: [openai/gpt-4o, qwen/qwen3-vl-235b-a22b-thinking]

  healthbench_grader:
    model: openai/gpt-5.2
    temperature: 0.2
    max_tokens: 2048
    also_run_with: [openai/gpt-4o]

  mimic_cxr_answer:
    model: openai/gpt-4o
    temperature: 0.2
    max_tokens: null
    also_run_with: [qwen/qwen3-vl-235b-a22b-thinking]

  # GPT-4o log-probabilities (top 5 per token) were used for the token-level analyses.
  glaucoma_answer:
    model: openai/gpt-4o
    temperature: 0.2
    max_tokens: null
    top_logprobs: 5
    also_run_with: [qwen/qwen3-vl-235b-a22b-thinking]

  mimic_iii_answer:
    model: openai/gpt-4o
    temperature: 0.2
    max_tokens: null
    top_logprobs: 5
    also_run_with: [qwen/qwen3-vl-235b-a22b-thinking]

  realworld_summary:
    model: qwen/qwen3-vl-235b-a22b-thinking
    temperature: 0.2
    max_tokens: 2000

  # Translates English/Thai-pivot summaries into Chinese before physician review.
  realworld_normalise_to_chinese:
    model: google/gemini-3-pro-preview
    temperature: 0.2
    max_tokens: 2000
